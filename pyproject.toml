[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "captivate-toolkit"
version = "0.1.0"
description = "Extract, render, and optionally analyze legacy Adobe Captivate projector files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Captivate Toolkit contributors" }]
dependencies = ["python-dotenv>=1.0"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
ai = ["openai>=1.0"]
render = ["playwright>=1.40"]
dev = ["captivate-toolkit[ai,render]", "build", "pip-audit", "pytest", "ruff"]

[project.scripts]
captivate = "captivate_toolkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/captivate_toolkit"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "CHANGELOG.md", "docs", "tests", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
